// v0.41 deviation, with the arithmetic. The spec's loop-gain table assumed a maximum
// trade multiplier of 4.0 and derived G = 0.76. Measured against the live tables, the
// true ceiling is M = 4.687 — ten champions at level 10 with Twitch leading push the
// caravan passive well past what the table assumed — and at that M the circuit reopens
// at G = 1.042. The spec's own break-even was 4.59, i.e. just below the real ceiling.
// Every other term in G is fixed: Jerry confirmed 600 timber -> 28-38 steel and
// Piltover charging 80 steel, and the 500-700 mana yield is what gives mana its Era-3
// identity. TRANSMUTE_COST is the one term nobody pinned, and it is the loop's return
// edge, so it is where the correction belongs: 14 gives G = 0.744 at M = 4.687.
// LOOP GUARD, second of three (see transmuteYield above). 14 -> 20. This is the ONE number in
// this round that Jerry did not ask me to move and that I moved anyway, so it is flagged as
// such in BUILD REPORT §1: notes 17 and 34 together cannot both ship at the old price without
// putting the trade circuit into net gain, and the circuit's timber leg is priced here.
// It is a real 43% nerf to the earliest loop in the game and it is reported, not buried.
var TRANSMUTE_COST = 20;
// v0.42 Part 4. Kittens' getCraftRatio is a PLAIN ADDITIVE SUM with no cap —
// workshop 0.06/copy, factory 0.05/copy — and a developed settlement runs about x3.2.
// RR ran x5 and then multiplied the scriptorium upgrades on top for x9.375, roughly
// three times Kittens' ceiling. That compounds per tier: at x9.375 a Tome's nominal
// 8,750 furs became an effective 99.6, a x88 discount, and on a four-tier Era-3 chain
// the ceiling was x5^4 = x625. Four rounds of recipe tuning were done against numbers
// up to 88x smaller than the ones on the page. 2.2 gives x3.2 at ceiling — parity.
var CRAFT_YIELD_LIMIT = 2.2;
var PORO_SACRIFICE_COST = 60;
function craftYield(id) {
  // The sacrifice is not a workshop craft: its yield is exactly the number of
  // Watcher's Eyes, 1:1, the way Kittens' ziggurat gainMultiplier works.
  // Workshop and artisan bonuses deliberately do not touch it.
  if (id === "poroTears") return count("watchersEye");
  var sum = bfield("workshop", "craftBoost") * count("workshop") + champPassive("craft") / 100;
  if (hasPolicy("piltoverConcord")) sum += 0.08;
  sum += traitBonus("artisan");
  if (CHEM_CRAFTS[id]) sum += traitBonus("alchemist");
  if (METAL_CRAFTS[id]) sum += traitBonus("smith");
  var y = 1 + limitedDR(sum, CRAFT_YIELD_LIMIT);
  // The scriptorium line (Kittens' Codex Vox/Logos arc): a dedicated upgrade path for
  // the furs -> parchment -> tome chain, so committing to knowledge pays off late.
  if (id === "parchment") {
    if (S.upgrades.scribesGuild) y *= 1.10;
    if (S.upgrades.greatLibrary) y *= 1.20;
  } else if (id === "tome") {
    if (S.upgrades.illuminators) y *= 1.10;
    if (S.upgrades.greatLibrary) y *= 1.20;
  }
  return y;
}
// UPGRADE!!!: while Heimerdinger leads, crafts consume 20% fewer materials
function craftCostMult() { return leaderIs("heimerdinger") ? 0.85 : 1; }
// v0.41 §2.6: the Yordle Workshop has no business making alchemy more efficient, and
// the craftYield() coupling was what made the Timber -> Demacia -> Steel -> Piltover
// -> Mana -> transmute -> Timber circuit a net-positive faucet. Flat yield; Riverstone
// Tools still applies. Available forever, exactly as before.
// v0.58.1 NOTE 17 (Jerry): "The transmute button should update the mana -> timber values based
// on craft effectiveness as well."
//
// THE BUTTON WAS NOT LYING — the maths was. `transmuteMana()` called `gain("timber",
// transmuteYield())` and transmuteYield() read ONE upgrade, so Yordle Workshops, the artisan
// trait, Heimerdinger and the Piltover Concord all raised every OTHER craft's output and left
// this one flat. The crafting panel even displayed `craftYield()` in the Transmute tooltip
// beside a `transmuteYield()` figure on the button — two different numbers for one action, and
// the tooltip's was the one that was wrong about the game.
//
// Transmute IS a craft. It now takes the same craft-yield multiplier every other recipe takes,
// which fixes the display and the production in the same line, because they are now the same
// line. `craftYield("transmute")` returns the general multiplier: `transmute` is in neither
// CHEM_CRAFTS nor METAL_CRAFTS, so no specialist trait double-dips.
// ==========================================================================================
// THE LOOP GUARD, and why note 17 ships BOUNDED. `test-v41` computes the gain of the
// timber -> Demacia -> steel -> Piltover -> mana -> transmute -> timber circuit at every
// multiplier's ceiling and requires G < 0.8, because a circuit that returns more timber than it
// consumes is infinite resources. It was at 0.744 before this round — 93% of the way to the
// limit — and TWO of Jerry's notes push on it at once:
//
//   note 34 raises Piltover's mana 500-700 -> 900-1,300 (x1.83), which is x1.83 on the circuit.
//   note 17 puts craft effectiveness on the transmute, which is a further x3.2 at the ceiling.
//
// Measured: G would have been 4.366. Both notes ship, and three numbers move to hold the guard.
// This one is the first: transmute takes craft effectiveness at a QUARTER weight rather than in
// full. The note is satisfied — the mana->timber figure now moves with craft effectiveness, on
// the button and in the maths, which is what it did not do before — and transmute does not
// become the one unbounded multiplier in a file where every other stack is bounded by a DR
// primitive. See TRANSMUTE_COST and Piltover's steel price for the other two.
var TRANSMUTE_CRAFT_WEIGHT = 0.20;
function transmuteYield() {
  return (S.upgrades.riverstoneTools ? 1.15 : 1) *
         (1 + (craftYield("transmute") - 1) * TRANSMUTE_CRAFT_WEIGHT);
}
// v0.53, Jerry directive 5 — the Arcanist's Circle. Called once per game-year boundary
// from step(); see the UPGRADES entry for why it is yearly and why it fires only at the
// ceiling. It runs the ORDINARY transmute — same cost, same yield, same upgrades — so it
// can never be better than the player's own hand, only more punctual.
var ARCANIST_SHARE = 0.33;
// v0.58.1 NOTE 48.2 C — "Automatically crafts some materials once per year (beams, slabs,
// gears, iron plating)". It rides the SAME yearly hook the Arcanist's Circle already uses, so
// there is one definition of "a year has passed" in this file rather than two that can drift.
//
// It PAYS THE OUTPUT AND NOT THE INPUT — the Manufactory is already paying, continuously, in
// crystals, and charging it twice would make the discovery a downgrade for anyone whose beam
// chain was the thing they needed automated. Each Manufactory turns out one of each good per
// year, so the yield is a building count and the player can read it off the tab.

// behaviour every other production line has.

  // the STOCKPILE — both the source's, both driven by the one constant.
  var share = automationShare(n);
  AUTOMATION_PAIRS.forEach(function (pair) {
    var cap = caps[pair.from];

    // is bounded: below the trigger it does nothing at all, so it can never compete with a player
    // who is actually spending their timber.
    if (!(cap > 0) || (S.res[pair.from] || 0) < cap * automationTrigger()) return;

    // the whole year (v0.59.1 note 5's rule, applied to the same problem in a second place).
    logMuted++;

// "craft ×200" is one undoable action that returns the player to before the batch — which is
// what a misclick on ALL actually needs — rather than 200 JSON.stringify(S) calls of which only
// the last survives.

  // batch has run, so it names the recipe rather than the haul.

    // v0.54, DEV DIRECTIVE 14. A craft was silent: the player clicked, numbers moved in the
    // resource column, and nothing said what had been made or how much of it. `done` is the
    // number of actions that actually completed — which is NOT `times`, because craftItem

// a farm and 200 more to unstaff it every time Deepwinter turns.
//
// `assignJob` is EXTENDED, not duplicated: it takes a magnitude, clamps it against every
// constraint it already enforced one-at-a-time (idle headcount, the job's own `max()`, and zero
// on the way down) and applies the whole move in one write. A single +1 is the same code path
// with n = 1, so there is exactly one place where a job assignment can be wrong.
// `Infinity` is the "all" magnitude and needs no special case — the clamps handle it.
function assignJob(id, delta) {

  if (!job) return;

    var assigned = 0;
    JOBS.forEach(function (j) { assigned += S.jobs[j.id] || 0; });

// v0.47 Part 4A — OFFLINE PROGRESSION
// ------------------------------------------------------------
// The old implementation made ONE applyProduction(elapsed) call with dt up to 43,200
// seconds. Everything that lives in step() and not in applyProduction() therefore did not
// happen while the player was away: no wanderer ever arrived, a settlement could not
// starve, champions earned no XP, the whole gap ran at the season you left in, no
// expedition or chronicle event fired, and twelve hours of income accrued even against a
// ceiling that filled after ten minutes.
//
// This replays the REAL step() instead. Kittens takes the other route — seven per-manager
// fastforward routines plus a separate enforceLimits — but its own source flags that
// choice as fragile in three places ("XXX Partially duplicates resources#fastforward and
// #enforceLimits"). RR has exactly one economy and should not grow a second.
//
// Granularity is one game DAY, which is Kittens' own fast-forward unit (delta / 2000 ms,
// and a day is 10 ticks x 200 ms). At the 12-hour cap that is 21,600 iterations — a second
// or two — where tick granularity would be 216,000 calls to computeRates().
var DAY_MS = TICKS_PER_DAY * TICK_MS;                                   // 2,000 ms

// MEASURED: with the RNG held constant, catch-up reproduces live play EXACTLY — 0% drift on
// every resource and on population, over a game-hour. (An earlier 2.16% reading was my own
// measurement error: the two arms were drawing different random event streams, so I was

//

// complete and correct, and never called from anywhere — applyOfflineProgress() called the
// blocking runCatchUp(), and #catchup-banner sat in the DOM at line 214 and was never

      var extra = "";
      craftOut += '<div class="rrow craftable" data-res="' + r + '"><span class="res-name">' + def.name + '</span><span class="res-nums"><span class="res-val">' + fmt(S.res[r]) + "</span>" + extra + "</span>" +
        (craftDef2 ? '<div class="qc-row">' + qcLinks(craftDef2.id) + "</div>" : "") + "</div>";
    } else if (def.kind === "loot") {
      var lootRate = rate !== 0 ? '<span class="res-rate ' + (rate >= 0 ? "pos" : "neg") + '">' + (rate >= 0 ? "+" : "") + fmtRate(rate) + "/s</span>" : "";
      lootOut += '<div class="rrow" data-res="' + r + '"><span class="res-name">' + def.name + '</span><span class="res-nums"><span class="res-val">' + fmt(S.res[r]) + "</span>" + lootRate + "</span></div>";
    } else {
      var stockCraft = CRAFTS.find(function (c) { return c.out === r && c.show(S); });
      var capStr = caps[r] !== undefined ? '<span class="res-cap">/' + fmt(caps[r]) + "</span>" : "";
      stockOut += '<div class="rrow' + (stockCraft ? " craftable" : "") + '" data-res="' + r + '"><span class="res-name">' + def.name + '</span><span class="res-nums"><span class="res-val">' + fmt(S.res[r]) + "</span>" + capStr +
        '<span class="res-rate ' + (rate >= 0 ? "pos" : "neg") + '">' + (rate >= 0 ? "+" : "") + fmtRate(rate) + "/s</span></span>" +
        (stockCraft ? '<div class="qc-row">' + qcLinks(stockCraft.id) + "</div>" : "") + "</div>";
    }
  }
  var out = '<div class="res-section">Resources</div>' + (stockOut || '<div class="rrow"><span class="res-name" style="font-style:italic;font-weight:400">nothing yet…</span></div>');
  out += '<div class="rrow" style="margin-top:6px"><span class="res-name">Wanderers</span><span class="res-nums"><span class="res-val">' + S.pop + '</span><span class="res-cap">/' + maxPop() + "</span></span></div>";
  if (S.jackboxes > 0) lootOut += '<div class="rrow"><span class="res-name">Jack in the Box</span><span class="res-nums"><span class="res-val">' + S.jackboxes + "</span></span></div>";
  if (lootOut) out += '<div class="res-section">Loot</div>' + lootOut;
  var craftMenu = "";
  if (S.seenMax.mana >= TRANSMUTE_COST) {
    craftMenu += '<div class="rrow craftable"><span class="res-name">Timber</span><span class="res-nums"><span class="res-val">' + fmt(S.res.timber) + '</span></span><div class="qc-row">' + qcLinks("transmute") + "</div></div>";
  }
  if (craftMenu || craftOut) out += '<div class="res-section">Crafting</div>' + craftMenu + craftOut;
  col.innerHTML = out;

  // Keep breakdown tooltips live across the per-tick re-render
  if (hoveredRes) {
    var row = col.querySelector('[data-res="' + hoveredRes + '"]');
    if (row) showResourceTooltip(hoveredRes, row);
    else { hoveredRes = null; hideTooltip(); }
  }
  if (moraleHovered) {
    var ms = document.getElementById("morale-stat");
    if (ms) showMoraleTooltip(ms);
    else { moraleHovered = false; hideTooltip(); }
  }
}

var TABS = [

  // science from the library, workshop from the workshop (js/buildings.js). Crafting is
  // renamed Workshop to match the thing it is.
  { id: "settlement", name: "Settlement", show: function () { return true; } },
  // v0.44 gameplay notes 2 & 4 — a tab appears when the thing it describes exists.
  // v0.54, DEV DIRECTIVE 17: the Wanderers tab carries the IDLE count. An idle wanderer is
  // the one state in this game that is pure loss — they eat and produce nothing — and the
  // only way to notice was to open the tab and look. `badge` returns a string or "", and
  // renderTabs appends it; any tab can grow one.
  { id: "village", name: "Wanderers", show: function () { return count("shelter") > 0; },
    badge: function () { var n = idleWanderers(); return n > 0 ? " (" + n + ")" : ""; } },

  { id: "crafting", name: "Workshop", show: function () {
      return CRAFTS.some(function (c) { return c.id !== "transmute" && (!c.show || c.show(S)); });
    } },

function renderTabs() {
  var bar = document.getElementById("tab-bar");
  bar.innerHTML = TABS.filter(function (t) { return t.show(); }).map(function (t) {
    return '<button class="tab-btn' + (S.activeTab === t.id ? " active" : "") + '" data-tab="' + t.id + '">' +
      t.name + (t.badge ? t.badge() : "") + "</button>";
  }).join("");
  bar.querySelectorAll("[data-tab]").forEach(function (btn) {
    // v0.48 ITEM 4. This handler has to be edited HERE: renderTabs() re-binds onclick
    // every time it runs, so a handler attached anywhere else is discarded on the next
    // uiDirty. renderAll() destroys the node `btn` points at, so the class goes on a
    // freshly queried element — and the query is scoped to #tab-bar rather than the
    // document, because ".active" is a plausible class to reuse elsewhere later.
    btn.onclick = function () {
      S.activeTab = btn.getAttribute("data-tab");
      renderAll();
      var active = document.getElementById("tab-bar").querySelector(".tab-btn.active");
      if (active) active.classList.add("tab-pop");
    };
  });
}

      var xpLine = "";
      if (need !== null) {

          '<span class="b-count">Lv ' + lvl + (lvl >= 10 ? " ✸" : "") + "</span>" +

      '<div style="height:12px;border:1px solid var(--border-gold);border-radius:2px;background:var(--panel2);overflow:hidden">' +
        '<div style="height:100%;width:' + (wp * 100).toFixed(1) + '%;background:' +
        (S.warpSpending ? "var(--purple)" : "var(--teal)") + ';transition:width 0.2s"></div></div>' +
      '<div style="font-size:11.5px;margin-top:4px">' +
        (S.warpSpending ? '<b style="color:var(--purple)">SPENDING — the settlement runs at +' + Math.round((TIMEWARP_SPEED - 1) * 100) + "%</b>"
                        : '<span style="color:var(--teal)">Banking…</span>') +
        ' · <b>' + Math.floor(wSec / 60) + "m " + (wSec % 60) + "s</b> of " +
        Math.round(TIMEWARP_MAX_MS / 60000) + "m stored</div>" +
      // v0.59 Part 8 note 3 — the button. Disabled while spending or while the bank is empty,
      // for the same two reasons spendTimeWarp() refuses.
      '<button id="btn-warp" style="margin-top:6px"' +
        ((S.warpSpending || (S.timeWarpMs || 0) <= 0) ? " disabled" : "") + '>' +
        (S.warpSpending ? "Spending…" : "Spend " + Math.floor(wSec / 60) + "m " + (wSec % 60) + "s of banked time") +
      "</button></div>";
  }
  el.innerHTML = html;
  var warpBtn = el.querySelector("#btn-warp");
  if (warpBtn) warpBtn.onclick = function () { spendTimeWarp(); renderAll(); };

  el.querySelectorAll("[data-champ]").forEach(function (btn) {
    var id = btn.getAttribute("data-champ");
    var d = champDef(id);
    btn.onmouseenter = function () {
      var lvl = champLevel(id);
      var tc = trainCost(id);
      var xpNote = lvl >= 10 ? "" :
        " Experience accrues every second — " + CHAMP_XP_LEADER + "/s while leading, " + CHAMP_XP_BENCH +
        "/s on the bench, multiplied by your Training Grounds and Halls of Heroes. It is never spent, so a champion at a threshold keeps banking and may level several times at once.";
      showTooltip(btn, { title: d.name, cost: tc || {},
        note: (tc ? "TRAIN to level " + (lvl + 1) + " needs " + fmt(xpTotalFor(lvl + 1)) + " XP and the above." : "SKILL: " + d.skill + " (mastered).") + xpNote,
        effects: [champPassiveNow(id) + " (always on)", "★ As Leader: " + d.lead + "."],
        flavor: d.flavor });
    };
    btn.onmouseleave = hideTooltip;
  });
  el.querySelectorAll("[data-champlead]").forEach(function (chip) {
    chip.onclick = function (ev) { ev.stopPropagation(); makeLeader(chip.getAttribute("data-champlead")); };
  });
  el.querySelectorAll("[data-train]").forEach(function (chip) {
    chip.onclick = function (ev) { ev.stopPropagation(); trainChamp(chip.getAttribute("data-train")); };
  });
  el.querySelectorAll("[data-recruit]").forEach(function (btn) {
    var id = btn.getAttribute("data-recruit");
    var d = champDef(id);
    btn.onclick = function () { recruitChamp(id); };
    btn.onmouseenter = function () {
      showTooltip(btn, { title: d.name, cost: recruitCost(id),
        note: "Each champion recruited raises the Renown price of the next by " + Math.round((RECRUIT_RATIO - 1) * 100) + "% — the signature material does not scale. The later rungs also ask for wrought goods: stone slabs, gearwork, then hextech, so the last three are paced by what your industry can actually build.",
        effects: [d.passive.desc + " (always on, grows with training)", "★ As Leader: " + d.lead + "."],
        flavor: d.flavor });
    };
    btn.onmouseleave = hideTooltip;
  });
}

function renderVillage(el) {
  var assigned = 0;
  JOBS.forEach(function (j) { assigned += S.jobs[j.id] || 0; });
  var idle = S.pop - assigned;
  var html = '<div class="panel"><h2>Wanderers</h2>';
  html += '<div style="font-size:13px;margin-bottom:8px">Population: <b style="color:var(--gold-bright)">' + S.pop + " / " + maxPop() + '</b> · Idle: <b style="color:var(--gold-bright)">' + idle + "</b></div>";
  html += '<div style="font-size:11px;font-style:italic;margin-bottom:10px">' +
    (S.pop === 0 ? "Build shelters and keep provisions stocked — wanderers will come."
      : "Each wanderer eats " + CONSUMPTION.toFixed(3) + " provisions/s, forever. Assign them work below; they get better at it the longer they do it.") + "</div>";
  if (S.techs.almanac && S.pop > 0) {
    var provBd = computeRates("provisions");
    var farmAmt = 0;
    (provBd._bd || []).forEach(function (e) { if (e.label && e.label.indexOf("Farmstead") !== -1) farmAmt += e.amt; });
    // v0.56 Part 3: both figures come from seasonFarmMult() now. The old code recomputed the
    // multiplier by hand AND hard-coded `winterFarm = leaderIs("leona") ? 1 : 0.25`, so the
    // forecast could disagree with computeRates() -- and after v0.55 extended farmMult to the
    // job path, it did. Deepwinter is looked up by id rather than by its literal 0.25, so a
    // future change to the SEASONS table cannot leave a stale number in this tooltip.
    var curMult = seasonFarmMult(currentSeason(), S.weather === "warm" ? 1.15 : S.weather === "chilly" ? 0.5 : 1);
    var winterFarm = seasonFarmMult(SEASONS.find(function (x) { return x.id === "winter"; }), 1);
    var winterNet = provBd.provisions - farmAmt + (curMult > 0 ? farmAmt * (winterFarm / curMult) : 0);
    html += '<div style="font-size:11px;margin-bottom:10px">Deepwinter forecast (a cold snap can halve this again): <b style="color:' + (winterNet >= 0 ? "var(--green)" : "var(--red)") + '">' + (winterNet >= 0 ? "+" : "") + fmtRate(winterNet) + '/s provisions</b>' +
      (winterNet >= 0 ? " — this settlement will hold through the cold." : " — stores will drain in winter. Stock provisions, or your farmers may be too few.") + "</div>";
  }
  JOBS.forEach(function (j) {
    if (j.tech && !S.techs[j.tech] && !(S.jobs[j.id] > 0)) return;
    if (j.unlock && !j.unlock(S) && !(S.jobs[j.id] > 0)) return;
    // ====================================================================================
    // v0.59.1 NOTE 2 (Jerry): "The new buttons on the wanderer page are terrible - it creates a
    // lot of vertical scrolling that we want to avoid. Model it after this screenshot from
    // kittens. Essentially there is a mouseover on the + and - buttons that states +5/+25/+all."
    //
    // v0.59 Part 8 note 1 tried to fix the CLIPPING by letting eight chips wrap. That traded a
    // clipped row for a two-line row and made the problem it was fixing worse: eight jobs became
    // sixteen lines. The source solves it a different way and the screenshot is unambiguous —
    // ONE row per job, exactly TWO controls, and the bulk steps live in a FLYOUT that opens on
    // hover BENEATH the button it belongs to.
    //
    // THE FLYOUT IS ABSOLUTELY POSITIONED, and that is the entire point rather than a detail: an
    // overlay does not participate in layout, so opening one cannot push the rows below it down.
    // Eight jobs cost eight rows whether every flyout is open or none is.
    //
    // THE STEPS ARE KITTENS' OWN — 5 / 25 / all, from the screenshot, not RR's old 5 / 20 / all.
    // `1e9` still stands in for "all"; assignJob() clamps it.
    var jc = (S.jobs[j.id] || 0);
    var canAdd = idle > 0 && !(j.max && jc >= j.max());
    var step = function (d, label) {
      return '<button class="job-step" data-job="' + j.id + '" data-d="' + d + '"' +
        ((d > 0 ? canAdd : jc > 0) ? "" : " disabled") + '>' + label + "</button>";
    };
    html += '<div class="job-row"><div class="job-info"><div class="job-name">' + j.name +
      ' <span class="job-count">(' + jc + ')</span></div><div class="job-desc">' + j.desc + "</div></div>" +
      '<div class="job-ctl">' +
        '<button class="job-btn" data-job="' + j.id + '" data-d="-1"' + (jc > 0 ? "" : " disabled") + '>−</button>' +
        '<div class="job-flyout">' + step(-5, "−5") + step(-25, "−25") + step(-1000000000, "−all") + "</div>" +
      "</div>" +
      '<div class="job-ctl">' +
        '<button class="job-btn" data-job="' + j.id + '" data-d="1"' + (canAdd ? "" : " disabled") + ">+</button>" +
        '<div class="job-flyout">' + step(5, "+5") + step(25, "+25") + step(1000000000, "+all") + "</div>" +
      "</div></div>";
  });
  html += "</div>";

  if (festivalUnlocked()) {
    var fc = festivalCost();
    var fOn = festivalActive();
    html += '<div class="panel"><h2>Festival</h2>' +
      // v0.58 DEV NOTE 12 — the panel states the new effect and the new duration. The
      // remaining time is now read off the TICK counter, in game-months, because the festival
      // is denominated in game time.
      '<div style="font-size:11px;font-style:italic;margin-bottom:8px">Kittens hold festivals; so does everyone who has ever survived a hard winter. ' +
      'For a full year afterwards the settlement carries itself differently, and the songs written during one outlast it. ' +
      'Held ' + (S.festivals || 0) + ' time' + ((S.festivals || 0) === 1 ? "" : "s") + '.</div>' +
      '<div class="btn-grid"><button id="btn-festival"' + (fOn || !canAfford(fc) ? " disabled" : "") + '>' +
      '<span class="b-name">' + (fOn ? "Festival under way (" + festivalSeasonsLeft() + " seasons left)" : "Hold a Festival") + '</span>' +
      '<span class="b-cost">' + costHtml(fc) + '</span>' +
      '<span class="b-desc">Morale +' + Math.round((FESTIVAL_MORALE_MULT - 1) * 100) + '% for one year, +' + fmt(Math.round(FESTIVAL_GOLD_BASE + FESTIVAL_GOLD_PER_HEARTH * count("bardsHearth"))) + ' gold, +' + Math.round(20 + 10 * count("archive")) + ' knowledge.</span>' +
      "</button></div></div>";
  }

  html += renderCensus();
  el.innerHTML = html;
  // v0.59.1 note 2: `[data-job]` covers the two `job-btn`s AND the six `job-step`s in the
  // flyouts, so one selector still wires the whole row. `stopPropagation` keeps a flyout click
  // from also reaching the button underneath it.
  el.querySelectorAll("[data-job]").forEach(function (btn) {
    btn.onclick = function (ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      assignJob(btn.getAttribute("data-job"), parseInt(btn.getAttribute("data-d"), 10));
    };
  });
  var fb = document.getElementById("btn-festival");
  if (fb) {
    fb.onclick = function () { holdFestival(); };
    fb.onmouseenter = function () {
      showTooltip(fb, { title: "Hold a Festival",
        desc: "Mushrooms, plumes and a year's worth of the larder. What a settlement of this size can spare.",
        cost: festivalCost(),
        // v0.62 PART 6.2 / DEV NOTE 11 (Jerry): "The Festival tooltip should list the renown
        // reward." v0.61 Part 5.2 added 25 renown to `holdFestival()` and never added it here.
        // **READ THE CONSTANT**, as v0.61's own trade tooltip does — and note that this is the
        // THIRD round running in which a payout shipped without its tooltip, which is what dev
        // note 1 was about at v0.61 and what dev note 11 is about now.
        // Gated on Call to Arms because `gainRenown()` is: a tooltip promising renown before the
        // gate would be advertising something the code refuses to pay.
        effects: ["Morale +" + Math.round((FESTIVAL_MORALE_MULT - 1) * 100) + "% for one full game-year (400 days)",
                  "+" + fmt(Math.round(FESTIVAL_GOLD_BASE + FESTIVAL_GOLD_PER_HEARTH * count("bardsHearth"))) + " gold in visitors' coin"]
                 .concat(S.techs.callToArms ? ["+" + FESTIVAL_RENOWN + " renown"] : [])
                 .concat(["One festival at a time — the next can only start when this one is over"]) });
    };
    fb.onmouseleave = hideTooltip;
  }
  wireCensus(el);
}

function censusJobName(id) {
  if (!id) return "Idle";
  var j = JOBS.filter(function (x) { return x.id === id; })[0];
  return j ? j.name : "Idle";
}
function renderCensus() {
  syncRoster();
  if (!S.pop) return "";
  // v0.44 gameplay note 3 — the Census is a lore unlock, not a starting feature.
  // Knowing every wanderer by name, trade and rank is record-keeping, and
  // record-keeping is a thing a settlement learns to do.
  if (!S.upgrades.keepingTheRolls) {
    return '<div class="panel"><h2>Census</h2><div style="font-size:11px;font-style:italic">' +
      S.pop + ' wanderers live here, and nobody has written down who. ' +
      'Research <b>Keeping the Rolls</b> in the Lore tab to name them, read their traits, ' +
      'and watch them climb the ranks at their trade.</div></div>';
  }
  var roster = S.wanderers.slice();
  var filter = S.censusFilter || "all";
  var counts = { all: roster.length, idle: 0 };
  roster.forEach(function (w) { var k = w.j || "idle"; counts[k] = (counts[k] || 0) + 1; });

  var html = '<div class="panel"><h2>Census</h2>';
  html += '<div style="font-size:11px;font-style:italic;margin-bottom:8px">Everyone who lives here. Working Wanderers climb the ranks at their trade — Bronze through <b>Challenger</b>, the top rank — and a higher rank means more output from that job. Traits are rolled on arrival and apply always, whatever the Wanderer is doing.</div>';

  // aggregate trait effects, so the sum is legible rather than invisible
  var tsum = [];
  TRAITS.forEach(function (t) {
    if (t.id === "none") return;
    var n = traitCounts()[t.id] || 0;
    if (!n) return;
    tsum.push('<span title="' + t.desc + '">' + t.icon + " " + t.name + " ×" + n + ' <span style="color:var(--teal)">(+' + (traitBonus(t.id) * 100).toFixed(2) + "%)</span></span>");
  });
  if (tsum.length) html += '<div style="font-size:11px;margin-bottom:8px">Settlement knacks: ' + tsum.join(" &nbsp;·&nbsp; ") + "</div>";

  var tabs = [["all", "All"], ["idle", "Idle"]].concat(JOBS.filter(function (j) { return counts[j.id]; }).map(function (j) { return [j.id, j.name]; }));
  html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">';
  tabs.forEach(function (t) {
    if (t[0] === "idle" && !counts.idle) return;
    html += '<button data-census="' + t[0] + '" style="width:auto;margin:0;padding:2px 9px;font-size:11px;' +
      (filter === t[0] ? "border-color:var(--gold);color:var(--gold-bright)" : "") + '">' + t[1] + " (" + (counts[t[0]] || 0) + ")</button>";
  });
  html += "</div>";

  var shown = roster.filter(function (w) { return filter === "all" || (filter === "idle" ? !w.j : w.j === filter); });
  shown.sort(function (a, b) { return (b.xp || 0) - (a.xp || 0); });
  var CENSUS_PAGE = 60;
  var truncated = shown.length > CENSUS_PAGE;
  html += '<div style="max-height:340px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px">';
  shown.slice(0, CENSUS_PAGE).forEach(function (w) {
    // v0.54 directive 8: the headline rank is the rank IN THE TRADE THEY ARE DOING, and the
    // other trades they have banked experience in are listed underneath. An idle wanderer
    // has no current trade, so their card leads with the best rank they hold anywhere and
    // says which trade it is in — otherwise moving someone to the bench would blank them.
    var others = rankedJobs(w);
    var lead = w.j ? { job: w.j, rank: rankOf(w, w.j) } : (others[0] || null);
    var r = lead ? lead.rank : RANKS[0];
    var pct = Math.round(rankProgress(w, lead ? lead.job : null) * 100);
    var t = traitDef(w.t);
    var rest = others.filter(function (o) { return !lead || o.job !== lead.job; }).slice(0, 3);
    html += '<div style="border:1px solid var(--border);border-radius:2px;padding:5px 7px;background:var(--panel)">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:4px">' +
        '<span style="font-size:12px;color:var(--text-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + w.nm + "</span>" +
        '<span class="census-trait" data-trait="' + w.t + '" style="cursor:help;color:var(--teal);font-size:12px">' + t.icon + "</span></div>" +
      '<div style="font-size:10.5px;color:var(--text);margin-top:1px">' + censusJobName(w.j) +
        (r.bonus > 0 ? (w.j ? ' <span style="color:var(--green)">+' + (r.bonus * 100).toFixed(2).replace(/\.?0+$/, "") + "%</span>"
                            : ' <span style="color:var(--text)" title="Rank bonuses only apply while working, and only in the trade they were earned in">(+' + (r.bonus * 100).toFixed(2).replace(/\.?0+$/, "") + "% when working)</span>") : "") + "</div>" +
      '<div style="font-size:10.5px;margin-top:2px;color:' + RANK_COLOR[r.id] + '">' + r.name +
        (r.id === "challenger" ? " ✸" : "") +
        (!w.j && lead ? ' <span style="color:var(--text)">as ' + censusJobName(lead.job) + "</span>" : "") + "</div>" +
      '<div style="height:3px;background:#1a2333;border-radius:2px;margin-top:3px"><div style="height:3px;width:' + pct + '%;background:' + RANK_COLOR[r.id] + ';border-radius:2px"></div></div>' +
      (rest.length ? '<div class="census-others" style="font-size:9.5px;color:var(--text);margin-top:3px">' +
        rest.map(function (o) { return '<span style="color:' + RANK_COLOR[o.rank.id] + '">' + o.rank.name + "</span> " + censusJobName(o.job); }).join(" · ") + "</div>" : "") +
      "</div>";
  });
  html += "</div>";
  if (truncated) html += '<em class="hint">Showing the 60 most experienced of ' + shown.length + " — filter by job to see the rest.</em>";
  html += "</div>";
  return html;
}
function wireCensus(el) {
  el.querySelectorAll("[data-census]").forEach(function (btn) {
    btn.onclick = function () { S.censusFilter = btn.getAttribute("data-census"); uiDirty = true; renderAll(); };
  });
  el.querySelectorAll(".census-trait").forEach(function (sp) {
    var t = traitDef(sp.getAttribute("data-trait"));
    sp.onmouseenter = function () {
      showTooltip(sp, { title: t.name, desc: t.desc + (t.per ? " Applies no matter what job they hold, or whether they hold one at all." : ""),
        effects: t.per ? ["Across the settlement: +" + (traitBonus(t.id) * 100).toFixed(2) + "%"] : [] });
    };
    sp.onmouseleave = hideTooltip;
  });
}

function renderLore(el) {
  var html = '<div class="panel"><h2>Research</h2><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><div style="font-size:11px;font-style:italic">Assign Loremasters to gather knowledge. Knowledge is gated by its cap — Archives and Academies raise the ceiling.</div>' +
    '<button id="btn-hidedone-r" style="width:auto;margin:0;padding:3px 10px;font-size:11px;white-space:nowrap">' + (S.hideDoneR ? "▸ show completed" : "▾ hide completed") + "</button></div><div class=\"btn-grid\">";
  var anyNext = false;
  // v0.45 Part 6: the branch techs are declared in their own block at the end of TECHS
  // (they are a group, not a continuation of the chain), so declaration order is no
  // longer price order. Render by cost so the player always reads an ascending ladder.
  TECHS.slice().sort(function (a, b) { return (a.cost.knowledge || 0) - (b.cost.knowledge || 0); }).forEach(function (t) {
    if (S.techs[t.id]) {
      if (S.hideDoneR) return;
      html += '<button class="owned"><span class="b-name">✓ ' + t.name + '</span><span class="b-desc">' + t.desc + "</span></button>"; return;
    }
    if (t.req && !S.techs[t.req]) return; // deep future stays hidden — no overwhelm
    anyNext = true;
    if (t.unlock && !t.unlock(S)) {
      // Visible but locked: the player must always know what to work toward
      html += '<button class="owned" style="opacity:0.6;cursor:default"><span class="b-name">🔒 ' + t.name + '</span><span class="b-cost" style="color:var(--gold)">' + (t.gate ? t.gate(S) : "Locked") + '</span><span class="b-desc">' + t.desc + "</span></button>";
      return;
    }
    var afford = canAfford(discCost(t.cost));
    html += '<button data-tech="' + t.id + '"' + (afford ? "" : " disabled") + '><span class="b-name">' + t.name + '</span><span class="b-cost">' + costHtml(discCost(t.cost)) + '</span><span class="b-desc">' + t.desc + "</span></button>";
  });
  if (!anyNext) html += '<em class="hint">Every song has been sung, every page written — for this age of the world.</em>';
  html += "</div></div>";

  html += '<div class="panel"><h2>Discoveries</h2><div style="display:flex;justify-content:flex-end;margin-bottom:6px">' +
    '<button id="btn-hidedone-d" style="width:auto;margin:0;padding:3px 10px;font-size:11px;white-space:nowrap">' + (S.hideDoneD ? "▸ show completed" : "▾ hide completed") + '</button></div><div class="btn-grid">';
  var upShown = 0;
  UPGRADES.forEach(function (u) {
    if (S.upgrades[u.id]) {
      if (S.hideDoneD) return;
      html += '<button class="owned"><span class="b-name">✓ ' + u.name + '</span><span class="b-desc">' + u.desc + "</span></button>"; upShown++; return;
    }
    if (!upgradeVisible(u)) return;
    upShown++;
    var afford = canAfford(discCost(u.cost));
    html += '<button data-upg="' + u.id + '"' + (afford ? "" : " disabled") + '><span class="b-name">' + u.name + '</span><span class="b-cost">' + costHtml(discCost(u.cost)) + '</span><span class="b-desc">' + u.desc + "</span></button>";
  });
  html += "</div>";
  if (!upShown && !S.hideDoneD) html += '<em class="hint">Nothing discovered yet. Keep building.</em>';
  html += "</div>";

  // ---- Policies: radio-style groups, one permanent choice each ----
  if (policyAnyOpen()) {
    var resolvedCount = POLICY_GROUPS.filter(function (g) { return !!policyChoice(g.id); }).length;
    html += '<div class="panel"><h2>Policies</h2><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">' +
      '<div style="font-size:11px;font-style:italic">Permanent choices, paid in Culture. Both sides of a pair are worth the same — pick the one that sounds like your settlement. Choosing one closes the other for the rest of the run.</div>' +
      (resolvedCount ? '<button id="btn-hidedone-p" style="width:auto;margin:0;padding:3px 10px;font-size:11px;white-space:nowrap">' + (S.hideDoneP ? "▸ show settled" : "▾ hide settled") + "</button>" : "") + "</div>";
    var shownGroups = 0;
    POLICY_GROUPS.forEach(function (g) {
      var chosen = policyChoice(g.id);
      var open = policyGroupOpen(g);
      if (!open && !chosen) return;
      if (chosen && S.hideDoneP) return;
      shownGroups++;
      html += '<div class="section-label">' + g.name + (chosen ? " · settled" : "") + "</div>";
      html += '<div style="font-size:11px;font-style:italic;margin-bottom:6px">' + g.blurb + "</div>";
      html += '<div class="btn-grid cols3">';
      g.options.forEach(function (o) {
        if (chosen === o.id) {
          html += '<button class="owned"><span class="b-name">✓ ' + o.name + '</span><span class="b-cost" style="color:var(--purple)">ADOPTED</span><span class="b-desc">' + o.desc + "</span></button>";
        } else if (chosen) {
          html += '<button class="owned" style="opacity:0.4;cursor:default"><span class="b-name">' + o.name + '</span><span class="b-cost">not taken</span><span class="b-desc">' + o.desc + "</span></button>";
        } else {
          html += '<button data-policy="' + o.id + '"' + (canAfford(o.cost) ? "" : " disabled") + '><span class="b-name">' + o.name + '</span><span class="b-cost">' + costHtml(o.cost) + '</span><span class="b-desc">' + o.desc + "</span></button>";
        }
      });
      html += "</div>";
    });
    if (!shownGroups) html += '<em class="hint">Every policy so far is settled.</em>';
    else if (POLICY_GROUPS.some(function (g) { return !policyGroupOpen(g) && !policyChoice(g.id); }))
      html += '<em class="hint">More policies open as the settlement grows.</em>';
    html += "</div>";
  }

  el.innerHTML = html;
  var hdr = document.getElementById("btn-hidedone-r");

function renderWilds(el) {
  var html = '<div class="panel"><h2>The Wilds</h2><div style="font-size:11px;font-style:italic;margin-bottom:6px">Vigor accrues while wanderers live here — spending it is up to you. Loot never comes from waiting. The four resource camps have no cooldown — hunt them as often as Vigor allows. Each banks up to two charges (◉), and a hunt that has one spends it for a ×3 haul. Hunter\'s Lodges raise camp yields +15% each, Junglers +5% (currently ×' + campYieldMult().toFixed(2) + ' on materials, ×' + campYieldMult(true).toFixed(2) + ' on comforts — skill brings home more ore, not proportionally more comfort).</div><div class="btn-grid">';
  EXPEDITIONS.forEach(function (e) {
    var cdLeft = campCooldownLeft(e);
    if (e.tech && !S.techs[e.tech]) return;
    if (e.tab && e.tab !== "wilds") return;      // v0.54 directive 3: the Scouting Party lives in Trade
    var afford = canAfford(expCost(e)) && cdLeft <= 0;
    var cdStr = (e.cooldown || isChargeCamp(e)) ? '<span class="b-count" data-cdlabel="' + e.id + '">' + campChargeLabel(e) + "</span>" : "";
    // ======================================================================================
    // v0.58.1 NOTE 12 (Jerry): "Wild Hunts with no cooldown should have a +5/+20/+all buttons
    // for bulk hunting."
    //
    // THE CONDITION IS EXACT AND IT MATTERS: only camps with NO cooldown AND NO charge timer
    // get the chips. A cooldown camp can be run once and then not again, so a ×20 on the Drake
    // Hunt would either be a lie or a way to skip a cooldown; a charge camp banks a ×3 haul
    // that a blind bulk run would spend on the first clear and waste. The four resource camps
    // are limited only by Vigor, which is exactly what a bulk button should be limited by.
    // Same `mini-btn`/`dim` convention as the craft chips and note 4's +caravan.
    // ======================================================================================
    var bulk = "";
    if (!e.cooldown) {   // v0.59 Part 8 note 4 — charge camps get the chips; cooldown camps do not
      var bc = expCost(e);
      var afN = function (k) { return Object.keys(bc).every(function (r) { return S.res[r] >= bc[r] * k; }); };
      bulk = '<span class="mini-btn' + (afN(1) ? "" : " dim") + '" data-expx="' + e.id + ':1000000000" title="as many as Vigor allows">ALL</span>' +
             '<span class="mini-btn' + (afN(20) ? "" : " dim") + '" data-expx="' + e.id + ':20">×20</span>' +
             '<span class="mini-btn' + (afN(5) ? "" : " dim") + '" data-expx="' + e.id + ':5">×5</span>';
    }
    html += '<button data-exp="' + e.id + '"' + (afford ? "" : " disabled") + '>' + bulk + '<span class="b-name">' + e.name + "</span>" + cdStr + '<span class="b-cost">' + costHtml(expCost(e)) + '</span><span class="b-desc">' + e.desc + "</span></button>";
  });
  html += "</div></div>";

  var drakeCount = 0;
  DRAKE_TYPES.forEach(function (d) { drakeCount += S.drakes[d.id] || 0; });
  if (drakeCount > 0 || S.dragonSoul) {
    html += '<div class="panel"><h2>Drake Essences</h2><div class="drake-badges">';
    DRAKE_TYPES.forEach(function (d) {
      var n = S.drakes[d.id] || 0;
      if (n > 0) html += "<span>" + d.name + " ×" + n + " · " + d.desc + "</span>";
    });
    if (S.dragonSoul) html += '<span style="border-color:var(--purple);color:var(--purple)">DRAGON SOUL · +' + Math.round(DRAGON_SOUL_BONUS * 100) + '% all production</span>';
    html += "</div></div>";
  }
  el.innerHTML = html;
  el.querySelectorAll("[data-expx]").forEach(function (chip) {   // v0.58.1 NOTE 12
    var spec = chip.getAttribute("data-expx").split(":");
    chip.onclick = function (ev) { ev.stopPropagation(); runExpeditionBulk(spec[0], parseInt(spec[1], 10)); };
  });
  el.querySelectorAll("[data-exp]").forEach(function (btn) {
    var e = EXPEDITIONS.find(function (x) { return x.id === btn.getAttribute("data-exp"); });
    btn.onclick = function () { runExpedition(e.id); };
    // v0.47 Part 4.7: the renown line only appears once Renown is a currency you can spend.
    btn.onmouseenter = function () { showTooltip(btn, { title: e.name, cost: expCost(e),
      // v0.49 (Jerry, tooltip edit 2): the yield string is authored with " · " between
      // the things a run brings back. Split on it so each lands on its own line.
      yield: expYield(e).concat(
        S.techs.callToArms ? [renownYieldLine(e)] : []),
      flavor: e.desc }); };
    btn.onmouseleave = hideTooltip;
  });
}

function renderTrade(el) {
  var mult = tradeYieldMult();
  var html = '<div class="panel"><h2>Trade</h2><div style="font-size:11px;font-style:italic;margin-bottom:6px">Caravans are your embassies. They cost Culture and nothing else, raise that route\'s yield +2% each (to +60%), open its three cargo slots at 5 / 10 / 15, and steady the Noxian route. Each civilization deepens ONE of your craft chains — pick the one you want. Trade Docks raise every yield (currently ×' + mult.toFixed(2) + ').</div>';
  // v0.54 directive 3: the Scouting Party is rendered HERE now, with the same markup and
  // the same [data-exp] handler the Wilds uses. The old copy pointed the player at another
  // tab for the button that opens this one.
  var tradeExps = EXPEDITIONS.filter(function (e) {
    if (e.tab !== "trade") return false;
    if (e.tech && !S.techs[e.tech]) return false;
    if (e.id === "scouting" && factionsFoundCount() >= FACTIONS.length) return false;
    return true;
  });
  if (tradeExps.length) {
    html += '<div style="font-size:11px;font-style:italic;margin-bottom:6px;color:var(--gold)">' +
      (FACTIONS.length - factionsFoundCount()) + ' civilization' + (FACTIONS.length - factionsFoundCount() > 1 ? 's are' : ' is') +
      ' still out there somewhere.</div><div class="btn-grid">';
    tradeExps.forEach(function (e) {
      var cdLeft = campCooldownLeft(e);
      var afford = canAfford(expCost(e)) && cdLeft <= 0;
      html += '<button data-exp="' + e.id + '"' + (afford ? "" : " disabled") + '><span class="b-name">' + e.name + "</span>" +
        '<span class="b-count" data-cdlabel="' + e.id + '">' + campChargeLabel(e) + "</span>" +
        '<span class="b-cost">' + costHtml(expCost(e)) + '</span><span class="b-desc">' + e.desc + "</span></button>";
    });
    html += "</div>";
  }
  FACTIONS.forEach(function (f) {
    if (!factionFound(f.id)) return;
    var cv = caravanCount(f.id);
    var afford = canAfford(tradeCost(f));
    var standingStr = "Caravans: " + cv;
    if (f.failChance) standingStr += " · fail " + Math.round(f.failChance() * 100) + "%";
    // Dormant slots are hidden entirely — a material the player cannot craft is not
    // named. But the ROW COUNT is shown, so a player with 15 Noxus caravans and no
    // Chemtech Alloy learns the investment is not wasted without learning what it buys.
    var open = slotsOpen(f.id);
    var total = factionSlots(f.id).length;
    var shown = [];
    for (var si = 0; si < total; si++) {
      if (slotUnlocked(f.id, si)) {
        var sl = factionSlots(f.id)[si];
        shown.push(sl.label + " +" + slotAmount(f.id, si, sl.amt) + " " + RES[sl.res].name.toLowerCase() +
          " (" + Math.round(slotChance(f.id, si) * 100) + "%)");
      } else if (caravanCount(f.id) < slotThreshold(f.id, si)) {
        shown.push("[" + slotThreshold(f.id, si) + " caravans]");
      }
    }
    var bonusStr = total + " route" + (total === 1 ? "" : "s") + " · " + open + " open" +
      (shown.length ? " — " + shown.join(" · ") : "");
    var locked = !tradeOpen(f.id);
    html += '<button data-fac="' + f.id + '"' + (afford && !locked ? "" : " disabled") + ' style="margin-bottom:8px">' +
      // v0.58.1 NOTE 4 (Jerry): "+Caravan should be a button that is grayed and highlighted
      // accordingly." Every other mini-button in this file already carries `dim` when it cannot
      // be pressed — the ×10/×50 craft chips, the TRAIN chip, the ★ leader chip — and this one
      // alone did not, so it looked pressable at all times and silently did nothing when it
      // was not. Same class, same convention, no new mechanism.
      // v0.58.1 NOTE 14 — the bulk chips, ordered ALL / ×20 / ×5 to match the crafting panel.
      (locked ? "" : (function () {
        var tc2 = tradeCost(f);
        var afN = function (k) { return Object.keys(tc2).every(function (r) { return S.res[r] >= tc2[r] * k; }); };
        return '<span class="mini-btn' + (afN(1) ? "" : " dim") + '" data-tradex="' + f.id + ':1000000000" title="as many as the stores allow">ALL</span>' +
               '<span class="mini-btn' + (afN(20) ? "" : " dim") + '" data-tradex="' + f.id + ':20">×20</span>' +
               '<span class="mini-btn' + (afN(5) ? "" : " dim") + '" data-tradex="' + f.id + ':5">×5</span>';
      })()) +
      (locked ? "" : '<span class="mini-btn' + (canAfford(caravanCost(f.id)) ? "" : " dim") +
        '" data-bcv="' + f.id + '">+ caravan</span>') +
      '<span class="b-name">Send caravans to ' + f.name + " <span style=\"color:var(--teal);font-weight:400\">· " + f.family + "</span></span><span class=\"b-count\">" + standingStr + "</span>" +
      '<span class="b-cost">Expense: ' + costHtml(tradeCost(f)) + "</span>" +
      '<span class="b-cost" style="color:var(--teal)">Yield: ' + f.yieldDesc + "</span>" +
      (locked ? '<span class="b-desc" style="color:var(--red)">' + f.gate(S) + "</span>"
              : '<span class="b-cost" style="color:var(--gold)">Cargo slots: ' + bonusStr + "</span>") +
      "</button>";
  });
  html += "</div>";
  el.innerHTML = html;
  // v0.54 directive 3: the same wiring the Wilds gives its expedition buttons.
  el.querySelectorAll("[data-exp]").forEach(function (btn) {
    var e = EXPEDITIONS.find(function (x) { return x.id === btn.getAttribute("data-exp"); });
    btn.onclick = function () { runExpedition(e.id); };
    btn.onmouseenter = function () { showTooltip(btn, { title: e.name, cost: expCost(e),
      yield: expYield(e).concat(
        S.techs.callToArms ? [renownYieldLine(e)] : []),
      flavor: e.desc }); };
    btn.onmouseleave = hideTooltip;
  });
  el.querySelectorAll("[data-fac]").forEach(function (btn) {
    var f = FACTIONS.find(function (x) { return x.id === btn.getAttribute("data-fac"); });
    btn.onclick = function () { tradeCaravan(f.id); };
    btn.onmouseenter = function () {
      // ZONE 1 is the route's own line of flavour, directly under the civilization's name.
      // ZONE 2 lists the base haul and then every cargo slot the caravans have opened,
      // one per line — a five-caravan route was reading as a paragraph.
      var ys = [f.yieldAmt || f.yieldDesc];
      (f.slots || []).forEach(function (sl, i) {
        if (!slotUnlocked(f.id, i)) return;
        ys.push("+" + fmt(slotAmount(f.id, i, sl.amt)) + " " + RES[sl.res].name + " — " + sl.label +
          " (" + Math.round(slotChance(f.id, i) * 100) + "% a run)");
      });
      // v0.61 PART 5.3 / DEV NOTE 1 (Jerry): "Trades should show the renown reward."
      // `TRADE_RENOWN` has been paid on every caravan since v0.59 Part 2.3 and the tooltip has
      // never mentioned it — `ys` was built from cargo slots only, so the player had no way to
      // learn that trading is a renown faucet at all.
      //
      // READ THE CONSTANTS, DO NOT WRITE "+1". Caitlyn's lead ADDS `CAITLYN_TRADE_RENOWN` on top
      // (v0.58.1 note 21), so the resolved figure is what gets shown and the two constants are
      // summed in the same place the payout sums them. A literal here is how the v0.59 payout
      // and its two tooltips came to disagree with each other in the first place.
      if (S.techs.callToArms) {
        var trRen = TRADE_RENOWN + (leaderIs("caitlyn") ? CAITLYN_TRADE_RENOWN : 0);
        ys.push("+" + trRen + " renown a caravan" +
          (leaderIs("caitlyn") ? " (" + TRADE_RENOWN + " + " + CAITLYN_TRADE_RENOWN + " under Caitlyn)" : ""));
      }
      showTooltip(btn, { title: f.name, desc: f.yieldNote, cost: tradeCost(f), yield: ys, flavor: f.motto + "." });
    };
    btn.onmouseleave = hideTooltip;
  });
  el.querySelectorAll("[data-tradex]").forEach(function (chip) {   // v0.58.1 NOTE 14
    var spec = chip.getAttribute("data-tradex").split(":");
    chip.onclick = function (ev) { ev.stopPropagation(); tradeCaravanBulk(spec[0], parseInt(spec[1], 10)); };
  });
  el.querySelectorAll("[data-bcv]").forEach(function (chip) {
    var fid = chip.getAttribute("data-bcv");
    chip.onclick = function (ev) { ev.stopPropagation(); buildCaravan(fid); };
    chip.onmouseenter = function (ev) {
      ev.stopPropagation();
      var f = FACTIONS.find(function (x) { return x.id === fid; });
      // v0.49 (Jerry, tooltip edit 3.1): what a caravan buys, one line each, instead of a
      // paragraph the player has to parse. The slot lines say OPEN or the caravan count
      // that opens them, so the ladder is legible before you are on it.
      // ======================================================================================
      // v0.58.1 NOTE 5 (Jerry): "Caravan tooltip should not show what the 5/10/15 rewards are.
      // 5/10/15 rewards should only appear when the material/craft is already unlocked."
      //
      // The tooltip enumerated every cargo slot with its resource named, so a player two hours
      // from Chemtech was reading the words "requisitioned chemtech alloy" off a caravan chip.
      // It is the same spoiler rule the tooltip layer already enforces everywhere else through
      // `ttResKnown` (v0.53 directive 2) and that v0.58's notes 2 and 9 extended to storage and
      // to upgrade lines — this was the last place still leaking.
      //
      // The rule shipped: a slot is DESCRIBED only if the player has already seen its resource.
      // Unseen slots are counted, not named, so the ladder still reads as a ladder — the player
      // knows more is coming and does not know what.
      // ======================================================================================
      var n = caravanCount(fid), ys = ["Route yield +2% each, to a ceiling of +60%"];
      var hiddenSlots = 0;
      (f.slots || []).forEach(function (sl, i) {
        var at = 5 * (i + 1);
        // v0.61 PART 6.2 / DEV NOTE 10 (Jerry): "the 'deeper cargo slots' message is inaccurate."
        //
        // THE LINE WAS TESTING THE WRONG PROPERTY. `ttResKnown` is a resource VISIBILITY test —
        // "has the player ever seen this resource?" — and the sentence below claims a
        // CAPABILITY: goods "this settlement has not yet handled". The codebase already has the
        // capability test and has since v0.50: `slotAvailable(fid, i)` checks that the craft
        // producing the slot's resource exists and that its `show()` passes.
        //
        // THE TWO DISAGREE ON EXACTLY ONE CASE, and it is the reported bug: **can craft it, has
        // never actually held one.** Jerry's Piltover example is precise — the 10-caravan slot
        // pays support beams, the beam craft is unlocked and buildable, and because he had not
        // yet MADE a beam the slot counted as goods the settlement "has not handled". It has
        // handled them; it simply has none in the barn right now.
        if (!slotAvailable(fid, i)) { hiddenSlots++; return; }
        ys.push((n >= at && slotUnlocked(fid, i) ? "OPEN" : "at " + at + " caravans") + " — " +
          sl.label + ", " + Math.round(SLOT_CHANCE_FLOOR[i] * 100) + "% a run rising toward " +
          Math.round((SLOT_CHANCE_FLOOR[i] + SLOT_CHANCE_LIMIT[i]) * 100) + "%");
      });
      if (hiddenSlots > 0) ys.push(hiddenSlots + " deeper cargo slot" + (hiddenSlots > 1 ? "s carry" : " carries") +
        " goods this settlement has not yet handled");
      showTooltip(chip, { title: "Caravan #" + (n + 1), cost: caravanCost(fid), yield: ys,
        desc: "Fit out another caravan for the " + f.name + " route (" + f.family + " chain).",
        note: "Priced in Culture alone." });
    };
    chip.onmouseleave = hideTooltip;
  });
}

function renderAll() {
  hideTooltip();
  renderTabs();
  if (window.updateSceneBanner) window.updateSceneBanner(S.activeTab);
  var el = document.getElementById("tab-content");
  var visible = TABS.filter(function (t) { return t.show(); }).map(function (t) { return t.id; });
  if (visible.indexOf(S.activeTab) === -1) S.activeTab = "settlement";
  if (S.activeTab === "settlement") renderSettlement(el);
  else if (S.activeTab === "crafting") renderCrafting(el);
  else if (S.activeTab === "village") renderVillage(el);
  else if (S.activeTab === "lore") renderLore(el);
  else if (S.activeTab === "wilds") renderWilds(el);
  else if (S.activeTab === "trade") renderTrade(el);
  else if (S.activeTab === "targon") renderTargon(el);
  else if (S.activeTab === "champions") renderChampions(el);
}

// ============================================================
// PIXEL SCENE BANNER — presentational only, no game-state reads
// beyond S.activeTab. Small procedural pixel-art strip between the
// title and the calendar bar; the scene changes with the active tab.
// ============================================================
(function () {
  var canvas = document.getElementById("scene-canvas");
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height, groundY = H - 6;
  ctx.imageSmoothingEnabled = false;

  function cssVar(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    v = v && v.trim();
    return v || fallback;
  }
  var PAL = {
    bg: cssVar("--bg", "#010A13"), panel: cssVar("--panel", "#0A1428"),
    gold: cssVar("--gold", "#C89B3C"), goldBright: cssVar("--gold-bright", "#F0E6D2"),
    borderGold: cssVar("--border-gold", "#785A28"), teal: cssVar("--teal", "#0AC8B9"),
    purple: cssVar("--purple", "#9D4EDD"), green: cssVar("--green", "#08A66D"),
    red: cssVar("--red", "#BE3144"), text: cssVar("--text", "#A09B8C")
  };
  // v0.62 PARTS 6.4 / 6.5 — the two Crest colours, taken from the BUFF CHIPS the player already
  // associates with each state (`renderTop()` draws CREST OF CINDERS in #E8622D and CREST OF
  // INSIGHT in #4FA8D8), so the banner and the chip speak the same visual language. `PAL.red` is
  // the UI's danger red and would read as an error rather than as a forge.
  var CINDER_GLOW = "#E8622D", INSIGHT_GLOW = "#4FA8D8";

  function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }
  function hexToRgb(h) {
    h = h.replace("#", "");

    champions: { draw: function (f) {
      var g = ctx.createRadialGradient(120, groundY - 14, 2, 120, groundY - 14, 60);
      g.addColorStop(0, mix(PAL.bg, PAL.purple, 0.35)); g.addColorStop(1, PAL.bg);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
      drawGround(mix(PAL.panel, "#000000", 0.4));
      var cx = 120;
      for (var i = 0; i < 2; i++) {
        var t = wrap(f * 0.6 + i * 10, 20) / 20;
        ctx.globalAlpha = (1 - t) * 0.35;
        ctx.strokeStyle = i % 2 ? PAL.teal : PAL.purple;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, groundY - 10, 6 + t * 16, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // The champion itself is real Piskel art, drawn by drawChampionsSprites() on the
      // #scene-sprites layer -- this procedural draw() only lays down the ambient
      // background gradient, ground, and the two pulsing aura rings behind it.
    } }
  };

  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var frame = 0, currentTab = null, timer = null;

  function draw() {
    var scene = SCENES[currentTab] || SCENES.settlement;
    ctx.clearRect(0, 0, W, H);
    scene.draw(frame);
    drawSprites(currentTab, frame);
    if (!reduceMotion) frame++;
  }
  function startLoop() {
    if (timer || reduceMotion) return;
    timer = setInterval(draw, 220);
  }
  function stopLoop() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopLoop(); else startLoop();
  });

  window.updateSceneBanner = function (tabId) {
    if (!SCENES[tabId]) tabId = "settlement";
    if (tabId === currentTab) return;
    currentTab = tabId;
    frame = 0;
    draw();
  };

  updateSceneBanner("settlement");
  startLoop();
})();
// ============================================================
// BOOT
// ============================================================
function stampVersion() {
  var el = document.getElementById("version-note");
  if (el) el.textContent = el.textContent.replace(/\s*v\d+\.\d+\s*$/, "") + " " + VERSION;
}
function intro() {
  addLog("The Rune Wars are over. The land is scarred, silent — and waiting. Channel mana, and begin again.");
}
stampVersion();                       // v0.53: the footer is rendered FROM the VERSION constant
if (!tryAutoload()) { if (!migrateV1()) intro(); }
renderAll();
renderTop(computeRates());
setInterval(tick, TICK_MS);
setInterval(function () { saveGame(false); }, 30000);
window.addEventListener("beforeunload", function () { saveGame(false); });
</script>
</body>
